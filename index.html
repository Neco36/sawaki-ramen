(function () {
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function apply(lang) {
    var t = DICT[lang] || DICT.ja;
    document.documentElement.lang = t.htmlLang;
    document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = t[n.dataset.t] || ''; });
    document.querySelectorAll('[data-aria]').forEach(function (n) { n.setAttribute('aria-label', t[n.dataset.aria]); });
    document.querySelectorAll('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });

    var info = document.getElementById('info'); info.textContent = '';
    t.info.forEach(function (i) { var d = el('div'); d.appendChild(el('div', 'k', i.k)); d.appendChild(el('div', 'v pre', i.v)); info.appendChild(d); });

    var cats = document.getElementById('cats'); cats.textContent = '';
    t.cats.forEach(function (c) {
      var box = el('div', 'cat'); var h = el('h3', null, c.title);
      if (c.note) h.appendChild(el('span', null, c.note));
      box.appendChild(h);
      c.items.forEach(function (it) {
        var r = el('div', 'item'), l = el('div');
        l.appendChild(el('div', 'n', it[0])); if (it[1]) l.appendChild(el('div', 'o', it[1]));
        r.appendChild(l); r.appendChild(el('div', 'p', it[2])); box.appendChild(r);
      });
      cats.appendChild(box);
    });

    var days = document.getElementById('days'); days.textContent = '';
    t.days.forEach(function (d) {
      var r = el('div', 'row' + (d[1] === null ? ' closed' : ''));
      r.appendChild(el('span', null, d[0])); r.appendChild(el('span', null, d[1] === null ? t.closed : d[1]));
      days.appendChild(r);
    });
    try { localStorage.setItem('lang', lang); } catch (e) {}
  }
  var q = new URLSearchParams(location.search).get('lang'), saved = null;
  try { saved = localStorage.getItem('lang'); } catch (e) {}
  var start = DICT[q] ? q : (DICT[saved] ? saved : 'ja');
  document.querySelectorAll('.langs button').forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.lang); }); });
  apply(start);
})();
